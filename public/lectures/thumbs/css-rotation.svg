    </linearGradient>
  </defs>
  <rect x="120" y="180" width="200" height="160" fill="url(#lin)" transform="rotate(-12 220 260)"/>
  <rect x="400" y="190" width="180" height="140" fill="#7070ff" transform="rotate(18 490 260)"/>
  <text x="72" y="640" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, sans-serif" font-size="56" font-weight="800">Rotation and Gradients</text>

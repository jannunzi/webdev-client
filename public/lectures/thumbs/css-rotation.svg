<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title">
  <title id="title">Rotation and Gradients</title>
  <rect width="1280" height="720" fill="#1C1917"/>
  <rect x="0" y="0" width="18" height="720" fill="#F59E0B"/>
  <text x="72" y="64" fill="#FCD34D" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="700" letter-spacing="4">WEB DEV · LECTURE 4</text>
  <defs>
    <linearGradient id="lin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE047"/>
